# Reusable release for every renewvan repo that ships something.
# See docs/adr/0015-one-release-process-via-reusable-workflows.md.
#
# A repo's own .github/workflows/release.yml is a thin `workflow_dispatch` caller that passes
# `kind` and the repo's name. One run works out the next version from the latest stable tag,
# stamps it where the repo keeps one, tags that commit, creates the GitHub release, then
# builds what the repo ships:
#
#   kind: image     a multi-arch Docker image to ghcr.io/<owner>/<image>
#   kind: firmware  tag and GitHub release only; the tag is compiled as a gate, nothing is uploaded.
#                   The repo lists its variants with `python3 scripts/variants.py list` (a JSON array
#                   of names); each one is built from firmware/<variant>.yaml with
#                   manifests/<variant>.json, all stamped with the same tag.
#
# Stable releases are cut from `main`; a pre-release from whichever branch it is dispatched on
# (tests gate it, `main` and `:latest` stay untouched). Neither pushes a commit to a branch: the
# stamped release commit is reachable only from its tag, so `main` can be branch-protected. A
# stamped file on `main` (dashboard's package.json) therefore keeps its old version; the next
# version comes from the latest tag, never from that file.
name: Release (reusable)

on:
  workflow_call:
    inputs:
      kind:
        description: "image | firmware"
        type: string
        required: true
      bump:
        description: patch | minor | major, applied to the latest stable tag
        type: string
        default: patch
      version:
        description: 'Explicit version (e.g. 0.2.0 or 0.2.0-beta.1); overrides "bump"'
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false
      image:
        description: "kind=image: image name under ghcr.io/<owner>/ (e.g. driver-tank)"
        type: string
        default: ""
      driver-version-arg:
        description: "kind=image: pass the tag as the DRIVER_VERSION build arg (Drivers that publish Driver info)"
        type: boolean
        default: false
      stamp-package-json:
        description: Write the version into package.json in the commit the tag points at (JS repos)
        type: boolean
        default: false
      test-command:
        description: "Shell command that gates a pre-release (stable releases rely on the push-to-main CI run)"
        type: string
        default: ""
      node-version-file:
        description: Optional .node-version style file; when set, Node is set up for test-command
        type: string
        default: ""
      python-version:
        type: string
        default: ""
      esphome-version:
        description: "kind=firmware: pinned ESPHome version"
        type: string
        default: ""

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check the branch
        if: ${{ !inputs.prerelease && github.ref_name != 'main' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Stable releases are cut from main (dispatched on ${REF_NAME}). Tick 'prerelease' for a beta."
          exit 1

      # The latest stable tag is the source of truth: it cannot drift from a file.
      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT" ]; then
            version="${EXPLICIT#v}"
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev -- '-' | head -n1)"
            latest="${latest#v}"
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              patch) version="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::bump must be patch, minor or major (got '$BUMP')"; exit 1 ;;
            esac
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The version is stamped into the commit the tag points at (when the repo keeps one), so
      # what is built from the tag is what the tag says. The commit is a throwaway that only the tag
      # sees, stable or pre-release: it is never pushed to a branch.
      - name: Stamp package.json
        if: ${{ inputs.stamp-package-json }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"

      - name: Commit and tag
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "renewvan"
          git config user.email "github@renewvan.com"
          git add -A
          # A re-cut of a version already in the tree, or a repo with no stamped file, has nothing to commit.
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $TAG"
          fi
          sha="$(git rev-parse HEAD)"
          git push origin "$sha:refs/tags/$TAG"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--verify-tag --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"

  # The pre-release test gate runs caller-supplied shell (`test-command`) from a branch that may never
  # have been reviewed, so it gets its own job with read-only permissions and no credentials, apart
  # from the job that holds `packages: write`.
  test:
    if: ${{ inputs.kind == 'image' && inputs.prerelease && inputs.test-command != '' }}
    needs: cut
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.cut.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ inputs.python-version != '' }}
        with:
          python-version: ${{ inputs.python-version }}

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: ${{ inputs.node-version-file != '' }}
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: true

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

  # Stable releases are cut from `main`, where the push-to-main CI already ran the tests on the merge
  # commit, so `test` is skipped for them. A pre-release must pass it first.
  publish-image:
    if: ${{ !cancelled() && inputs.kind == 'image' && needs.cut.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [cut, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.cut.outputs.tag }}
          persist-credentials: false

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: ${{ inputs.driver-version-arg && format('DRIVER_VERSION={0}', needs.cut.outputs.tag) || '' }}
          # A pre-release publishes only its own tag, so it can never take `:latest` from the stable line.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ needs.cut.outputs.tag }}
            ${{ !inputs.prerelease && format('ghcr.io/{0}/{1}:latest', github.repository_owner, inputs.image) || '' }}

  firmware-variants:
    if: ${{ inputs.kind == 'firmware' }}
    needs: cut
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.cut.outputs.tag }}

      - name: List the firmware variants
        id: list
        run: echo "variants=$(python3 scripts/variants.py list)" >> "$GITHUB_OUTPUT"

  build-firmware:
    needs: [cut, firmware-variants]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.firmware-variants.outputs.variants) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.cut.outputs.tag }}

      # WiFi, MQTT and the OTA password are compiled into the firmware from secrets.yaml. A CI
      # build therefore carries the example placeholders, cannot join a van's network, and must
      # never be published: this job only proves the tagged tree compiles.
      - name: Placeholder secrets (build gate only, never uploaded)
        run: cp secrets.yaml.example secrets.yaml

      # The release tag is the firmware's version, shared by every variant: the variant's
      # manifest supplies the other stamped fields, exactly as scripts/flash.sh does locally.
      - name: Compose the manifest substitutions
        id: stamp
        env:
          VERSION: ${{ needs.cut.outputs.tag }}
          VARIANT: ${{ matrix.variant }}
          # A board is one physical unit named by its owner when flashing, so a gate build has none:
          # a fixed valid name stands in (nothing built here is flashed or uploaded).
          BOARD: ci-board
        run: |
          python3 scripts/variants.py board "${BOARD}"
          {
            echo "substitutions<<EOF"
            echo "version=${VERSION}"
            python3 scripts/manifest_substitutions.py "${VARIANT}" --board "${BOARD}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: firmware/${{ matrix.variant }}.yaml
          version: ${{ inputs.esphome-version }}
          substitutions: ${{ steps.stamp.outputs.substitutions }}
