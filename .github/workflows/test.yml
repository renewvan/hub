# Hub's own tests: the deploy/bootstrap script tests and the static security lints beside them
# (bin/test_compose_hardening.py, bin/test_pinning.py). docs/reference.md "Verifying security hardening".
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest bin/ -v --tb=short
