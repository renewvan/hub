# The broker's clients: one Mosquitto account each (docs/adr/0025-broker-has-per-client-accounts-and-anonymous-read-only.md,
# docs/adr/0026-anonymous-clients-are-refused-after-the-cutover.md, docs/adr/0027-per-board-drivers.md).
# The one list of them: bin/broker-accounts.sh reads it for the password file, the ACL, the credential files
# and rotation, and the tests derive what docker-compose.yml, .env.example, the host plugins and the hub
# plugin must say from it. The username is the key; the password is MQTT_<KEY>_PASSWORD in .env.
#
#   client <key> <kind> [<target> [<unit>]]   in account order (the ACL and password file follow it)
#   write  <key> <topic filter>               one line per filter the account may write, in ACL order
#
# kind is the credential channel:
#   config.ini  the driver reads [mqtt] in /etc/renewvan/<key>/config.ini, not the environment;
#               target is its compose service
#   compose     MQTT_USERNAME/PASSWORD come from docker-compose.yml; target is the service
#   envfile     a host plugin's /etc/renewvan/<target>; unit is its systemd service
#   reader      the read-only login for people and tools (MQTT Explorer, a dev dashboard) and for
#               bin/check-broker-auth.sh: no process to restart, and no write line
# `command` is the dashboard's public account. Board accounts esp32-<name> (ADR 0027, hub#162) are not listed:
# the boards are BROKER_ESP32_BOARDS in .env, and their write lines are the `esp32-<name>` ones below, with
# <name> standing for the board. They are flashed, never written from the Pi.
#
# Everyone reads renewvan/# (a global ACL rule), so there are no read lines. ADR 0025 sketches
# `pattern write renewvan/%u/#` for every driver, but a driver's entity topics are renewvan/<entity>/...,
# not renewvan/<driver>/... (wattcycle, venus and vedirect write `battery`, autoterm writes `heater`), so
# each account lists the namespaces it really writes.

client tank config.ini driver-tank
client gps config.ini driver-gps
client temperature config.ini driver-temperature
client tilt config.ini driver-tilt
client wattcycle config.ini driver-wattcycle
client autoterm config.ini driver-autoterm
client vedirect config.ini driver-vedirect
client logger compose logger
client venus compose driver-venus
client router compose driver-router
client demo compose driver-demo
client kiosk envfile kiosk.env renewvan-kiosk
client tailscale envfile tailscale.env renewvan-tailscale
client hub envfile hub.env renewvan-hub
client command compose dashboard
client reader reader

write tank renewvan/tank/#
write gps renewvan/gps/#
write temperature renewvan/temperature/#
write tilt renewvan/tilt/#
write router renewvan/router/#
write logger renewvan/logger/#
write tailscale renewvan/tailscale/#

write wattcycle renewvan/wattcycle/#
write wattcycle renewvan/battery/#

write venus renewvan/venus/#
write venus renewvan/battery/#
write venus renewvan/solar/#
write venus renewvan/charger/#
write vedirect renewvan/vedirect/#
write vedirect renewvan/battery/#
write vedirect renewvan/solar/#
write vedirect renewvan/charger/#

# The driver's own info/health (also its last will) are under renewvan/autoterm/ (checked in the pinned
# image, driver-autoterm v0.2.3: publisher.py), plus per-heater telemetry (four segments). The five-segment
# .../<prop>/set command topics are deliberately not covered: the driver only subscribes to them, and they
# belong to `command` (ADR 0021). Re-check these against the pinned image, not a checkout, when the
# driver-autoterm pin changes.
write autoterm renewvan/autoterm/info
write autoterm renewvan/autoterm/health
write autoterm renewvan/heater/+/+

# Everything demo publishes except renewvan/demo/enabled/set, which only `command` may write.
write demo renewvan/demo/enabled
write demo renewvan/demo/health
write demo renewvan/demo/+/info
write demo renewvan/demo/+/+/+

# State topics only (four segments); the five-segment .../set topics belong to `command`.
write kiosk renewvan/kiosk/display/+

# renewvan/hub/status and the retained shared settings (plugins/hub/hub_status.py SETTINGS).
write hub renewvan/hub/status
write hub renewvan/hub/primary-battery
write hub renewvan/hub/icons
write hub renewvan/hub/relay-groups
write hub renewvan/hub/relay-group-list
write hub renewvan/hub/relay-order
# The fleet (ADR 0035): which Drivers have retained info, and the bus contract version.
write hub renewvan/hub/fleet
# Winter mode (ADR 0033): its state, and the one command to the Hub power board. Only `hub` may send that,
# never `command`, so no client can skip the heater check and the clean shutdown. `+` because the board is
# whichever Driver announces hub_power; a board ignores it unless it is that board.
write hub renewvan/hub/winter-mode
write hub renewvan/+/winter-mode/set

# A board: its own Driver namespace (info, health, last will) plus relay state, name and driver, never
# relay/+/set. Relay ids are opaque (ADR 0027), so those three are not scoped to the board's own ids: see
# "Relay ownership" in the ADR 0027 addendum.
write esp32-<name> renewvan/esp32-<name>/#
write esp32-<name> renewvan/relay/+/state
write esp32-<name> renewvan/relay/+/name
write esp32-<name> renewvan/relay/+/driver

# Only the command topics, never state or health.
write command renewvan/relay/+/set
write command renewvan/relay/+/name/set
write command renewvan/kiosk/display/+/set
write command renewvan/heater/+/set
write command renewvan/heater/+/+/set
write command renewvan/demo/enabled/set
write command renewvan/hub/primary-battery/set
write command renewvan/hub/icons/set
write command renewvan/hub/relay-groups/set
write command renewvan/hub/relay-group-list/set
write command renewvan/hub/relay-order/set
write command renewvan/hub/winter-mode/set
