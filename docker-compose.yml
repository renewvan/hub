# The single install/setup path for the hub (see README.md's Install
# section): infra (Mosquitto, InfluxDB, Grafana) plus the six pinned,
# independently-published backend service images (`tank`, `battery`,
# `router`, `gps`, `logger`, `dashboard`) — per
# docs/adr/0001-compose-services-via-pinned-images-not-git-submodules.md,
# none of them are built from local/submodule source here. Bumping a
# service is a single-line `image:` tag edit below (git-tracked, no
# env var indirection); see `.env.example` for every other config
# value an installer needs to set.
#
# `docker compose pull && docker compose up -d` from a copy of
# `.env.example` (as `.env`) is the whole install. Data persists in
# named Docker volumes — for a host-path/bind-mount deployment (e.g.
# TrueNAS's Custom App "Install via YAML"), see your own deployment's
# compose override instead; this file is the plain-Compose-host path.
#
# MQTT:      <host>:1883 (plain), <host>:9001 (websockets)
# InfluxDB:  http://<host>:8086 (org=renewvan, bucket=renewvan)
# Grafana:   http://<host>:3000 (admin/admin on first run)
# Dashboard: http://<host>:8080

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: renewvan-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ${MOSQUITTO_CONFIG_PATH:-./docker/mosquitto/config}:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # History for tank/relay/battery/router topics (docs/architecture.md
  # "Application services" row). Written by renewvan/logger, one point
  # per renewvan/# message.
  influxdb:
    image: influxdb:2
    container_name: renewvan-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-renewvan-dev-only}
      DOCKER_INFLUXDB_INIT_ORG: renewvan
      DOCKER_INFLUXDB_INIT_BUCKET: renewvan
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-renewvan-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  # Ad-hoc/ops history charts (Grafana over InfluxDB), separate from the
  # v0 read-only mobile/web/kiosk dashboard (React app).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: renewvan-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

  # Native MQTT tank node (fresh + grey ADS1115 senders) — see
  # docs/porting-dbus-to-mqtt-node.md and
  # .scratch/renewvan-hub-v0-build/issues/02-native-mqtt-tank-driver.md.
  # Needs I2C device passthrough for the ADS1115; layered config.ini
  # override lives on the bind-mounted host path below.
  node-tank:
    image: ghcr.io/renewvan/node-tank:v0.8.0
    container_name: renewvan-tank
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
    volumes:
      - ${TANK_CONFIG_PATH:-./config/tank/config.ini}:/app/config.ini:ro

  # Native MQTT GPS/GLONASS/BeiDou node (NMEA 0183 over USB-serial,
  # u-blox-chip module) -- see node-gps's own README's "Topics published"
  # section. Needs USB-serial device passthrough; layered config.ini
  # override lives on the bind-mounted host path below (sets
  # [mqtt] host = mosquitto; serial_port defaults to /dev/ttyACM0 in the
  # image, correct for a u-blox-native USB GNSS receiver).
  #
  # Behind the `gps` profile: with a `devices:` entry, a missing
  # /dev/ttyACM0 makes Docker refuse to create the container and aborts the
  # whole `docker compose up -d`, taking every other service's deploy with
  # it. bin/deploy.sh enables the profile only when the device exists. For a
  # manual `docker compose up -d` on a Pi with the module, use
  # `docker compose --profile gps up -d`.
  node-gps:
    profiles: ["gps"]
    image: ghcr.io/renewvan/node-gps:v0.2.0
    container_name: renewvan-gps
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
    volumes:
      - ${GPS_CONFIG_PATH:-./config/gps/config.ini}:/app/config.ini:ro

  # Native MQTT temperature node: 1-Wire DS18B20 probes + the Pi's own CPU
  # thermal zone -- see node-temperature's own README's "Topics published"
  # section. The 1-Wire kernel driver must be enabled on the host
  # (dtoverlay=w1-gpio,gpiopin=<N> in /boot/firmware/config.txt). The probe
  # entries under /sys/bus/w1/devices are symlinks into
  # /sys/devices/w1_bus_master1, so both trees must be visible at the same
  # paths or the links dangle. The PARENTS (/sys/bus, /sys/devices) are
  # mounted read-only, not w1/ or w1_bus_master1 themselves: those only exist
  # once the overlay is loaded, and Docker refuses to start a container whose
  # bind-mount source is missing -- that would take every `compose up -d` down
  # on a Pi without 1-Wire, though the CPU sensor needs none of it.
  # /app/state is writable and persistent: name/unit edits from the dashboard
  # live there.
  node-temperature:
    image: ghcr.io/renewvan/node-temperature:v0.1.0
    container_name: renewvan-temperature
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
    volumes:
      - ${TEMPERATURE_CONFIG_PATH:-./config/temperature/config.ini}:/app/config.ini:ro
      - ${TEMPERATURE_STATE_PATH:-./config/temperature/state}:/app/state
      - /sys/bus:/sys/bus:ro
      - /sys/devices:/sys/devices:ro
      - /sys/class/thermal:/sys/class/thermal:ro

  # Native MQTT van-inclination node: reads a GY-521 / MPU-6050 accelerometer
  # on the same I2C bus as the tank node's ADS1115 (different address, no
  # conflict) -- see node-tilt's own README's "Topics published" section.
  # Needs I2C device passthrough. The axis mapping for how the board is
  # mounted lives in the bind-mounted config.ini. /app/state is writable and
  # persistent: the install level zero (set from renewvan/tilt/<id>/level_zero/set)
  # lives there and is lost on a container recreate if it isn't a mounted volume.
  node-tilt:
    image: ghcr.io/renewvan/node-tilt:v0.1.1
    container_name: renewvan-tilt
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
    volumes:
      - ${TILT_CONFIG_PATH:-./config/tilt/config.ini}:/app/config.ini:ro
      - ${TILT_STATE_PATH:-./config/tilt/state}:/app/state

  # Victron Venus OS MQTT -> renewvan-bus battery remap. Subscribes against
  # the GX device's own broker (VICTRON_*), publishes onto this
  # compose's renewvan bus (mosquitto). See
  # .scratch/renewvan-hub-v0-build/issues/04-victron-battery-bridge.md.
  node-battery:
    image: ghcr.io/renewvan/node-battery:v0.1.3
    container_name: renewvan-battery
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
      VICTRON_MQTT_HOST: ${VICTRON_MQTT_HOST}
      VICTRON_MQTT_PORT: ${VICTRON_MQTT_PORT:-1883}
      VICTRON_PORTAL_ID: ${VICTRON_PORTAL_ID}

  # RUT-360 Data to Server MQTT -> renewvan-bus router remap. Single
  # connection to this compose's own bus: subscribes the router's raw
  # feed on renewvan/router/<id>/raw, republishes normalized retained
  # fields. See .scratch/node-router/map.md.
  node-router:
    image: ghcr.io/renewvan/node-router:v0.1.0
    container_name: renewvan-router
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
      ROUTER_ID: ${ROUTER_ID:-main}

  # renewvan/# -> InfluxDB point writer, one point per message. See
  # .scratch/renewvan-hub-v0-build/issues/05-influxdb-logger.md.
  logger:
    image: ghcr.io/renewvan/logger:v0.1.3
    container_name: renewvan-logger
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      MQTT_HOST: ${RENEWVAN_HOST:-mosquitto}
      MQTT_PORT: ${RENEWVAN_PORT:-1883}
      MQTT_USERNAME: ${RENEWVAN_USERNAME:-}
      MQTT_PASSWORD: ${RENEWVAN_PASSWORD:-}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-renewvan-dev-token}
      INFLUXDB_ORG: renewvan
      INFLUXDB_BUCKET: renewvan

  # Read-only kiosk/laptop dashboard, served static (nginx/Caddy per its
  # own Dockerfile), connecting client-side over MQTT-over-WebSocket —
  # not a polling backend. See
  # .scratch/renewvan-hub-v0-build/issues/06-dashboard-web-app.md.
  dashboard:
    image: ghcr.io/renewvan/dashboard:v0.1.29
    container_name: renewvan-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_MQTT_WS_URL: ${VITE_MQTT_WS_URL}
      VITE_MQTT_USERNAME: ${VITE_MQTT_USERNAME:-}
      VITE_MQTT_PASSWORD: ${VITE_MQTT_PASSWORD:-}
volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  grafana-data:
