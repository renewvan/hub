apiVersion: 1

# The hub's InfluxDB (docker-compose.yml `influxdb`), queried with Flux.
# The token is read from the grafana container's environment
# (INFLUXDB_ADMIN_TOKEN, passed through by compose); it is never stored in git.
datasources:
  - name: InfluxDB
    uid: renewvan-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: renewvan
      defaultBucket: renewvan
    secureJsonData:
      token: ${INFLUXDB_ADMIN_TOKEN}
