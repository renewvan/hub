# Pi only (ADR 0025): appended to mosquitto.conf by bin/validate-broker-config.sh, never read in local dev
# (the dev broker has no password file). Global settings apply to both listeners (1883 and 9001): do not add
# `per_listener_settings true`. Anonymous clients stay allowed; the ACL limits them to read-only.
# Both files are generated by bin/ensure-secrets.sh into /etc/renewvan/mosquitto/ (mounted at /mosquitto/config).
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
