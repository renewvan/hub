listener 1883
protocol mqtt

# WebSocket listener for browser-based dashboards/tools (MQTT-over-WS)
listener 9001
protocol websockets

# v0 local dev: no auth, no TLS. Lock this down before this ever touches
# a renewvan network — see docs/architecture.md's Venus OS bridging notes.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
# stdout only: Docker's log driver rotates it (see the logging options on the mosquitto service in
# docker-compose.yml), so there is no unbounded log file on the SD card.
log_dest stdout

# Bounds for a broker on a LAN: cap concurrent clients and the size of one message. 1 MiB is far above the
# largest retained payload (solar yield history, per-cell battery data, driver info).
max_connections 100
message_size_limit 1048576
