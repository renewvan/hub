listener 1883
protocol mqtt

# WebSocket listener for browser-based dashboards/tools (MQTT-over-WS)
listener 9001
protocol websockets

# v0 local dev: no auth, no TLS. Lock this down before this ever touches
# a van network — see docs/architecture.md's Venus OS bridging notes.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
